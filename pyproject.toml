[project]
name = "campaign-validator"
version = "0.1.0"
description = "Quality-toolchain exam for a campaign validation application"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
]

[project.scripts]
campaign-validator = "campaign_validator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
